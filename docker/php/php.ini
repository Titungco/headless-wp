; Uploads flow straight into memory/S3 (humanmade/s3-uploads), not local disk,
; but PHP still needs headroom for image-processing intermediates in /tmp.
upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 256M
max_execution_time = 60

; Sessions aren't used (Auth0 handles admin auth, GraphQL is stateless) but
; point PHP's default temp paths at the one writable mount anyway.
session.save_path = /tmp
upload_tmp_dir = /tmp
sys_temp_dir = /tmp

; In-memory only — no file-cache directory needed on a read-only filesystem.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
opcache.file_cache = 0

expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr
