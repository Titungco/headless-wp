server {
	listen 8080;
	server_name _;
	root /var/www/html/web;
	index index.php;

	add_header X-Content-Type-Options nosniff always;
	add_header X-Frame-Options SAMEORIGIN always;
	add_header Referrer-Policy strict-origin-when-cross-origin always;

	location = /favicon.ico { log_not_found off; access_log off; }
	location = /robots.txt { log_not_found off; access_log off; }

	# Defense in depth: block xmlrpc.php before it reaches PHP-FPM at all.
	# WP core (and therefore xmlrpc.php) lives under /wp/ — Bedrock's split
	# webroot, see web/index.php and WP_SITEURL in config/application.php.
	location = /wp/xmlrpc.php {
		deny all;
		return 404;
	}

	# Media lives on S3 (humanmade/s3-uploads), never on the container's local
	# disk — content dir is web/app (CONTENT_DIR in config/application.php).
	location ^~ /app/uploads/ {
		return 404;
	}

	# WPGraphQL registers its endpoint relative to site_url(), not home_url() —
	# that's WP_SITEURL (.../wp), not WP_HOME, so the real path is /wp/graphql,
	# confirmed by actually querying it (plain /graphql just falls through to
	# the theme's homepage template, silently, with a 200 — not a 404).
	location = /wp/graphql {
		limit_req zone=graphql_limit burst=20 nodelay;
		try_files $uri /index.php?$args;
	}

	location / {
		try_files $uri $uri/ /index.php?$args;
	}

	location ~ \.php$ {
		fastcgi_split_path_info ^(.+\.php)(/.+)$;
		fastcgi_pass 127.0.0.1:9000;
		fastcgi_index index.php;
		include fastcgi.conf;
		fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
		fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
		fastcgi_read_timeout 60s;
	}

	location ~ /\. {
		deny all;
	}
}
